{% extends "base.html" %}

{% block title %}{{ website.name }} - Statistics{% endblock %}

{% block content %}
<div class="statistics-detail">
    <div class="back-button" style="margin-bottom: 20px;">
        <a href="/" class="btn btn-secondary btn-small">← Back to Dashboard</a>
        <a href="/website/{{ website.id }}" class="btn btn-secondary btn-small">← Website Details</a>
    </div>

    <h2>📊 {{ website.name }} Statistics</h2>

    <div class="stats-loading">
        <div class="alert alert-info">
            <span class="spinner"></span> Loading statistics for {{ website.name }}...
        </div>
    </div>

    <div id="statistics-container" style="display: none;"></div>
</div>

<style>
    .statistics-detail {
        animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .statistics-detail h2 {
        color: #667eea;
        font-size: 2em;
        margin-bottom: 30px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .stat-card:hover {
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        transform: translateY(-2px);
    }

    .stat-card h3 {
        color: #667eea;
        font-size: 0.9em;
        text-transform: uppercase;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .stat-value {
        font-size: 2.5em;
        font-weight: bold;
        color: #333;
    }

    .stat-subtitle {
        color: #999;
        font-size: 0.85em;
        margin-top: 5px;
    }

    .stats-section {
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
    }

    .stats-section h3 {
        color: #667eea;
        margin-bottom: 15px;
        font-size: 1.3em;
    }

    .stats-list {
        list-style: none;
        padding: 0;
    }

    .stats-list li {
        padding: 10px 0;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        justify-content: space-between;
    }

    .stats-list li:last-child {
        border-bottom: none;
    }

    .stats-list .label {
        color: #666;
        font-weight: bold;
    }

    .stats-list .value {
        color: #667eea;
        font-weight: bold;
    }

    .raw-stats {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 5px;
        font-family: monospace;
        font-size: 0.85em;
        overflow-x: auto;
        max-height: 400px;
        overflow-y: auto;
    }

    @media (max-width: 768px) {
        .stats-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const websiteId = '{{ website.id }}';
        const container = document.getElementById('statistics-container');
        const loading = document.querySelector('.stats-loading');

        fetch(`/api/statistics/${websiteId}`)
        .then(response => response.json())
        .then(data => {
            loading.style.display = 'none';
            container.style.display = 'block';

            let html = '';

            // Main stats grid
            html += '<div class="stats-grid">';

            html += `
                <div class="stat-card">
                    <h3>Total Items</h3>
                    <div class="stat-value">${data.total_items || 0}</div>
                    <div class="stat-subtitle">Total items scraped</div>
                </div>
            `;

            html += `
                <div class="stat-card">
                    <h3>Items in Last Run</h3>
                    <div class="stat-value">${data.last_run_count || 0}</div>
                    <div class="stat-subtitle">Items from most recent scrape</div>
                </div>
            `;

            if (data.last_run) {
                html += `
                    <div class="stat-card">
                        <h3>Last Run</h3>
                        <div class="stat-value">${data.last_run.split('T')[0]}</div>
                        <div class="stat-subtitle">${data.last_run.split('T')[1] ? data.last_run.split('T')[1].split('.')[0] : 'Unknown'}</div>
                    </div>
                `;
            }

            html += `
                <div class="stat-card">
                    <h3>Status</h3>
                    <div class="stat-value" style="font-size: 1.5em;">
                        ${data.enabled ? '🟢 Enabled' : '🔴 Disabled'}
                    </div>
                    <div class="stat-subtitle">${data.enabled ? 'Active' : 'Inactive'}</div>
                </div>
            `;

            html += '</div>';

            // Raw statistics section
            html += '<div class="stats-section">';
            html += '<h3>📋 Detailed Statistics</h3>';
            html += '<div class="raw-stats">' + JSON.stringify(data, null, 2) + '</div>';
            html += '</div>';

            container.innerHTML = html;
        })
        .catch(error => {
            loading.innerHTML = `<div class="alert alert-error">Error loading statistics: ${error.message}</div>`;
        });
    });
</script>
{% endblock %}
